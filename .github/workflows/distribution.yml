name: Crate distribution rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Inspect Rust crate archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check crates and assemble local archives
        run: |
          bash scripts/check-crate-packages.sh
          mkdir -p dist
          cp target/package/*.crate dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crate-distribution-rehearsal
          path: dist/*.crate
          if-no-files-found: error
          retention-days: 14
