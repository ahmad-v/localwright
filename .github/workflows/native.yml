name: Native platform validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'platform-validation')
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows x64
            runner: windows-2025
            arch: X64
          - target: Windows ARM64
            runner: windows-11-arm
            arch: ARM64
          - target: Linux x64
            runner: ubuntu-24.04
            arch: X64
          - target: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: ARM64
          - target: macOS Apple Silicon
            runner: macos-15
            arch: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.88-native-default-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.88-native-default-debug-
      - name: Install Linux GUI development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Compile and run native tests
        run: |
          cargo check --locked --workspace --all-targets --features localwright-core/figure-pdf
          cargo test --locked --workspace --features localwright-core/figure-pdf
