name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88-check-default-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.88-check-default-debug-
      - id: scope
        name: Classify changed paths without skipping the required check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BASE_SHA"
          if [[ "$EVENT_NAME" == "push" ]]; then base="$BEFORE_SHA"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          if [[ -z "$changed" ]]; then
            echo "run_rust=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|CITATION.cff|AUTHORS|LICENSE*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$changed"
          if [[ "$docs_only" == true ]]; then
            echo "run_rust=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify manifests and source format
        if: steps.scope.outputs.run_rust == 'true'
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
      - name: Verify default GUI and headless targets
        if: steps.scope.outputs.run_rust == 'true'
        run: |
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Validate capability registry and package manifests
        run: |
          python3 -m json.tool docs/capabilities.json > /dev/null
          cargo tree --locked > /dev/null
